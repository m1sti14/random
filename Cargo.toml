[package]
name = "randoms"
version = "0.1.0"
edition = "2024"

[dependencies]
fastrand = "2.5.0"
macroquad = "0.4"
rand = { version = "0.10.3", features = ["thread_rng", "std"] }
self_update = { version = "0.41", features = ["compression-flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
